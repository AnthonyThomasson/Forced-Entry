# gdstyle (https://github.com/atelico/gdstyle, v0.4.0, run through tools/gdstyle.sh): the formatter and style lint
# tools/lint.sh runs over every project script. Every rule is an error but some quality/* rules (below): 15 on, five
# off by decision, the reason beside each, and the three structural ones stage 3 of issue #76 turns on (18 on then).

max_line_length = 100
use_tabs = true

# Third-party code (the gdUnit4 addon), the engine's cache, coverage run folders, and the coverage tool's fixture
# project, which its tests compare byte for byte.
exclude = ["addons", ".godot", "artifacts", "tools/coverage/tests/fixtures"]

[rules]
"syntax/lex-error" = "error"
"syntax/reserved-identifier" = "error"
"naming/class-name-pascal-case" = "error"
"naming/function-name-snake-case" = "error"
"naming/variable-name-snake-case" = "error"
"naming/constant-name-screaming-case" = "error"
"naming/signal-name-snake-case" = "error"
"naming/enum-name-pascal-case" = "error"
"naming/enum-member-screaming-case" = "error"
"naming/file-name-snake-case" = "error"
"naming/signal-past-tense" = "error"
"naming/private-underscore-prefix" = "error"
"naming/node-name-pascal-case" = "error"
"format/max-line-length" = "error"
"format/trailing-whitespace" = "error"
"format/trailing-newline" = "error"
"format/no-tabs-as-spaces" = "error"
"format/boolean-operators" = "error"
"format/double-quotes" = "error"
"format/comment-spacing" = "error"
"format/no-unnecessary-parens" = "error"
"format/number-literals" = "error"
"format/one-statement-per-line" = "error"
"format/blank-lines" = "error"
"format/trailing-comma" = "error"
"format/operator-spacing" = "error"
"format/colon-spacing" = "error"
"format/comma-spacing" = "error"
"format/brace-spacing" = "error"
"format/call-paren-spacing" = "error"
"format/float-literal-zeros" = "error"
"format/large-number-underscores" = "error"
"format/enum-one-per-line" = "error"
"order/class-member-order" = "error"
# The quality/* rules (issue #76) at gdstyle's default thresholds. On, as errors:
"quality/unnecessary-pass" = "error"
"quality/self-comparison" = "error"
"quality/duplicate-dict-key" = "error"
"quality/duplicated-load" = "error"
"quality/max-inner-classes" = "error"
"quality/no-self-assign" = "error"
"quality/unreachable-code" = "error"
"quality/no-else-return" = "error"
"quality/max-function-length" = "error"
"quality/max-parameters" = "error"
"quality/type-hint" = "error"
"quality/max-nesting-depth" = "error"
"quality/max-returns" = "error"
"quality/max-branches" = "error"
"quality/max-local-variables" = "error"
"quality/max-public-methods" = "error"
"quality/max-file-length" = "error"
# Off by decision, each for the reason beside it:
"quality/no-debug-print" = "off" # GameLog.say must print() (interface 15); runner and tools print by design
"quality/await-in-loop" = "off" # `for ...: await t.seconds(...)` is how a GameTest steps time
"quality/empty-function" = "off" # virtual hooks (Item.primary, GameTest.configure ...) stay empty to override
"quality/allocation-in-loop" = "off" # setup loops that must make N nodes: spawning, wear, debris
"quality/process-get-node" = "off" # gdstyle v0.4.0 reads a % format in _process() as a %Node lookup
# Off until stage 3 of #76 (the structural splits) brings the tree to zero findings under each and turns it on:
"quality/max-class-variables" = "off"
