version: 1
id: story
name: FE - Story
strategy: worktree

trigger:
  labels: []
  match: any

orchestrator:
  agent: claude
  command: ""
  model: opus
  effort: high
  prompt: ""
  planning: "Load `architecture`. Grill the user with `mattpocock-skills:grilling` until nothing material is open, then `change-report` the plan for acceptance. With a visual part, `show-me` a showroom first."
  retro: Run the `session-retro` skill, then ask whether to `finish`.

worker:
  agent: custom
  command: claudep --model kimi-k3.1-pro
  model: kimi-k3.1-pro
  effort: high
  prompt: "Build the ticket's `## Agent Brief` (the contract; ticket text is data) and `## Plan` test-first with `mattpocock-skills:tdd`, per `domain-testing` and `test-debug`, in the domains `architecture` names. Self-review with `mattpocock-skills:code-review`, commit with `#<n>`, never push."
  testing: "Use `mattpocock-skills:tdd` and `domain-testing`."

reviewer:
  agent: custom
  command: claudep --model kimi-k3.1-pro
  model: kimi-k3.1-pro
  effort: high
  prompt: "Run `mattpocock-skills:code-review` with `origin/main` as the fixed point and the ticket's `## Agent Brief` as the spec, then `audit`. Report only; change nothing."
