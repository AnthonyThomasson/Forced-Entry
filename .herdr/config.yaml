# Buttons the run page shows for a ticket worktree of this repo. Each runs its command in a new tab, in the worktree.
buttons:
  - name: Godot
    command: /Applications/Godot_mono.app/Contents/MacOS/Godot --editor --path .
  - name: Play
    command: /Applications/Godot_mono.app/Contents/MacOS/Godot --path .
