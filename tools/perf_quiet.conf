# What `tools/run_tests.sh --quiet` waits for before it starts the perf tests: no other busy Godot, and a 1-minute load
# under max_load. The threshold is this box's idle baseline (about 5 with nothing of ours running); on timeout the run
# goes ahead and marks its results `loaded`. `--quiet=MINUTES` overrides timeout_min.
# A Godot is busy when an engine process (an editor, a test run, a game; not a godot-mcp server) burned more than busy_cpu
# percent of one core over a sample of busy_sample_s seconds: an idle editor and the mcp servers do not hold the gate.
# Measured on this Mac over 2 s: an idle editor burns 16 to 23 percent, a busy test run 101 to 113.
max_load=6
timeout_min=30
busy_cpu=50
busy_sample_s=2
