# What `tools/run_tests.sh --quiet` waits for before it starts the perf tests: no other Godot process, and a 1-minute load
# under max_load. The threshold is this box's idle baseline (about 5 with nothing of ours running); on timeout the run
# goes ahead and marks its results `loaded`. `--quiet=MINUTES` overrides timeout_min.
max_load=6
timeout_min=30
